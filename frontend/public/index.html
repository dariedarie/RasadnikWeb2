    <style>
      :root {
        --primary: #2e7d32;

      body {

      /* ===== Preloader: seme -> stabljika -> listovi -> krošnja, pa kružno otkrivanje sajta ===== */
      #preloader {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 42%, #ffffff 0%, #f1f8e9 45%, #dcedc8 100%);
        clip-path: circle(150% at 50% 42%);
        transition: clip-path .85s cubic-bezier(.7, 0, .25, 1);
        animation: pl-failsafe .4s ease 5s forwards;
      }
      #preloader.pl-done { clip-path: circle(0% at 50% 42%); pointer-events: none; }
      #preloader svg { width: 200px; height: 200px; overflow: visible; }
      #preloader .pl-soil { transform-origin: 100px 170px; transform: scaleX(0); animation: pl-soil .5s ease-out .1s forwards; }
      #preloader .pl-seed { animation: pl-drop .55s cubic-bezier(.3, 0, .5, 1.6) forwards; transform: translateY(-140px); }
      #preloader .pl-stem { stroke-dasharray: 80; stroke-dashoffset: 80; animation: pl-draw .5s ease-out .5s forwards; }
      #preloader .pl-leaf { transform-box: fill-box; transform: scale(0); animation: pl-pop .4s cubic-bezier(.3, 1.6, .5, 1) forwards; }
      #preloader .pl-leaf.l { transform-origin: 100% 100%; animation-delay: .8s; }
      #preloader .pl-leaf.r { transform-origin: 0% 100%; animation-delay: .9s; }
      #preloader .pl-crown { transform-origin: 100px 165px; animation: pl-sway 2.4s ease-in-out 1.6s infinite; }
      #preloader .pl-crown circle { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pl-pop .45s cubic-bezier(.3, 1.6, .5, 1) forwards; }
      #preloader .pl-crown circle:nth-child(1) { animation-delay: 1.0s; }
      #preloader .pl-crown circle:nth-child(2) { animation-delay: 1.08s; }
      #preloader .pl-crown circle:nth-child(3) { animation-delay: 1.16s; }
      #preloader .pl-crown circle:nth-child(4) { animation-delay: 1.24s; }
      #preloader .pl-crown circle:nth-child(5) { animation-delay: 1.32s; }
      #preloader .pl-crown circle:nth-child(6) { animation-delay: 1.40s; }
      #preloader .pl-crown circle:nth-child(7) { animation-delay: 1.46s; }
      #preloader .pl-pollen circle { opacity: 0; animation: pl-rise 2.2s ease-in 1.4s infinite; }
      #preloader .pl-pollen circle:nth-child(2) { animation-delay: 1.8s; }
      #preloader .pl-pollen circle:nth-child(3) { animation-delay: 2.1s; }
      #preloader .pl-pollen circle:nth-child(4) { animation-delay: 2.5s; }
      #preloader .pl-pollen circle:nth-child(5) { animation-delay: 2.9s; }
      #preloader .pl-name { margin-top: 14px; font-family: 'Poppins', Arial, sans-serif; font-weight: 700; font-size: 1.7rem; letter-spacing: .06em; color: #1b5e20; display: flex; }
      #preloader .pl-name span { display: inline-block; opacity: 0; transform: translateY(12px); animation: pl-letter .4s ease-out forwards; }
      #preloader .pl-name span:nth-child(n+6) { color: #43a047; }
      #preloader .pl-root { margin-top: 10px; height: 3px; width: 140px; border-radius: 3px; background: #c5e1a5; overflow: hidden; }
      #preloader .pl-root::after { content: ''; display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #8d6e63, #43a047); transform: scaleX(0); transform-origin: left; animation: pl-grow 1.5s cubic-bezier(.4, 0, .2, 1) .2s forwards; }
      @keyframes pl-soil { to { transform: scaleX(1); } }
      @keyframes pl-drop { 0% { transform: translateY(-140px); } 70% { transform: translateY(0); } 85% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
      @keyframes pl-draw { to { stroke-dashoffset: 0; } }
      @keyframes pl-pop { to { transform: scale(1); } }
      @keyframes pl-sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
      @keyframes pl-rise { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateY(-60px) translateX(8px); } }
      @keyframes pl-letter { to { opacity: 1; transform: translateY(0); } }
      @keyframes pl-grow { to { transform: scaleX(1); } }
      @keyframes pl-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #preloader, #preloader * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: opacity .3s !important; }
        #preloader.pl-done { clip-path: none; opacity: 0; }
      }
    </style>
